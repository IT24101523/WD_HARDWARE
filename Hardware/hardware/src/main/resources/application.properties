# --------------------------------------------------------
# Application Configuration - W J Digital Hardware System
# --------------------------------------------------------
server.port=8080
spring.application.name=hardware

# --------------------------------------------------------
# MySQL Database Configuration (XAMPP default settings)
# --------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hardware_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------
# JPA / Hibernate Configuration
# --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --------------------------------------------------------
# SQL Schema & Initial Data Script Settings
# --------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --------------------------------------------------------
# Thymeleaf & Static Resources Configuration
# --------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --------------------------------------------------------
# File Upload Configuration
# --------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --------------------------------------------------------
# Mail Configuration for Automated Supplier Procurement
# --------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=procurement@wjdigitalhardware.com
spring.mail.password=demo-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --------------------------------------------------------
# Hardware Yard Coordinates (Google Maps Reference)
# --------------------------------------------------------
hardware.store.latitude=6.2427
hardware.store.longitude=80.0381
hardware.store.address=30 Galle - Colombo Rd, Balapitiya, Sri Lanka
